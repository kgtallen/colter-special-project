<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" type="image/png" href="./favicon2.png?v=4"><title>Wordle</title>
<style>
:root{--bg:#fdf2f3;--fg:#2b1520;--sub:#7b5a66;--card:#fff;--line:#efd3d8;--rose:#b8325a;--ok:#5a9a5c;--near:#c8a232;--miss:#797b80;--key:#eadfe1;--tf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0f15;--fg:#f8e9ec;--sub:#c9a3ae;--card:#2a1721;--line:#4a2a37;--rose:#ef7b9b;--miss:#5a4a50;--key:#43303a}}
:root[data-theme="dark"]{--bg:#1c0f15;--fg:#f8e9ec;--sub:#c9a3ae;--card:#2a1721;--line:#4a2a37;--rose:#ef7b9b;--miss:#5a4a50;--key:#43303a}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh}
[hidden]{display:none!important}#game{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.gh{width:100%;max-width:480px;display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.gh h2{margin:0;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:26px}
.back{justify-self:start;background:none;border:0;color:var(--rose);font:600 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer;padding:8px 4px}
#msg{min-height:28px;margin:12px 0 4px;font-weight:600;text-align:center;padding:0 16px}
#board{display:grid;gap:6px;margin:6px 0 14px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{width:min(14vw,58px);height:min(14vw,58px);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(22px,7vw,30px);font-weight:700;text-transform:uppercase}
.tile.filled{border-color:var(--miss)}.tile.ok,.tile.near,.tile.miss{color:var(--tf);border-color:transparent}.ok{background:var(--ok)}.near{background:var(--near)}.miss{background:var(--miss)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#kb{width:100%;max-width:480px;padding:0 6px 10px;margin-top:auto}.krow{display:flex;justify-content:center;gap:5px;margin-bottom:6px}
.k{flex:1;max-width:44px;height:52px;border:0;border-radius:5px;background:var(--key);color:var(--fg);font-size:14px;font-weight:700;text-transform:uppercase;cursor:pointer;padding:0}.k.wide{flex:1.6;max-width:66px;font-size:12px}
.k.ok{background:var(--ok);color:#fff}.k.near{background:var(--near);color:#fff}.k.miss{background:var(--miss);color:#fff}
.btn{margin:6px 0 24px;padding:10px 24px;border-radius:999px;border:1.5px solid var(--fg);color:var(--fg);background:transparent;font:600 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer}.btn:hover{background:var(--fg);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:3px solid var(--rose);outline-offset:2px}@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style></head><body>
<div id="game">
<div class="gh"><a class="back" href="index.html" style="text-decoration:none">&#8592; Games</a><h2>Wordle</h2><span></span></div>
<div id="msg" role="status" aria-live="polite">Guess the five-letter word in six tries.</div><div id="board"></div><div id="kb"></div><button class="btn" id="wclear" type="button">Clear</button>
</div>
<script>
(function(){
var ANSWER="glove",MAX=6,LEN=5,WIN_NOTE="I glove you very much Colter. Happy anniversary!";
var rows=[],guesses=[],cur="",done=false,keyState={};
var board=document.getElementById("board"),msg=document.getElementById("msg"),kb=document.getElementById("kb");
for(var r=0;r<MAX;r++){var row=document.createElement("div");row.className="row";var t=[];for(var c=0;c<LEN;c++){var d=document.createElement("div");d.className="tile";row.appendChild(d);t.push(d)}board.appendChild(row);rows.push({el:row,tiles:t})}
var layout=["qwertyuiop","asdfghjkl","*zxcvbnm#"],keys={};
layout.forEach(function(s){var kr=document.createElement("div");kr.className="krow";s.split("").forEach(function(ch){var b=document.createElement("button");b.className="k";b.type="button";if(ch==="*"){b.textContent="Enter";b.className+=" wide";b.dataset.k="Enter"}else if(ch==="#"){b.textContent="Del";b.className+=" wide";b.dataset.k="Backspace"}else{b.textContent=ch;b.dataset.k=ch;keys[ch]=b}b.addEventListener("click",function(){press(b.dataset.k)});kr.appendChild(b)});kb.appendChild(kr)});
document.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;var k=e.key;if(k==="Enter"||k==="Backspace"||/^[a-zA-Z]$/.test(k)){press(k.length===1?k.toLowerCase():k)}});
function say(t){msg.textContent=t}
function render(){var rw=rows[guesses.length];if(!rw)return;for(var i=0;i<LEN;i++){var ch=cur[i]||"";rw.tiles[i].textContent=ch;rw.tiles[i].className="tile"+(ch?" filled":"")}}
function press(k){if(done)return;if(k==="Backspace"){cur=cur.slice(0,-1);render();return}
if(k==="Enter"){submit();return}
if(/^[a-z]$/.test(k)&&cur.length<LEN){cur+=k;render()}}
function score(g){var res=[],pool={},i;for(i=0;i<LEN;i++){res[i]="miss";if(g[i]===ANSWER[i])res[i]="ok";else pool[ANSWER[i]]=(pool[ANSWER[i]]||0)+1}
for(i=0;i<LEN;i++){if(res[i]!=="ok"&&pool[g[i]]>0){res[i]="near";pool[g[i]]--}}return res}
function invalidGuess(){var rw=rows[guesses.length];if(!rw)return;rw.el.classList.remove("shake");void rw.el.offsetWidth;rw.el.classList.add("shake");say("Not in word list");}
function submit(){if(cur.length<LEN){var rw=rows[guesses.length];rw.el.classList.remove("shake");void rw.el.offsetWidth;rw.el.classList.add("shake");say("Not enough letters");return}
var guess=cur.toLowerCase();if(guess!=="glove"){
 say("Checking word…");fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(guess)).then(function(r){if(!r.ok)throw new Error("not found");return r.json()}).then(function(){acceptGuess(guess)}).catch(function(){invalidGuess()});return;
}acceptGuess(guess);}
function acceptGuess(guess){if(done||guesses.length>=MAX)return;cur=guess;var res=score(cur),idx=guesses.length,rank={miss:1,near:2,ok:3};
for(var i=0;i<LEN;i++){rows[idx].tiles[i].className="tile "+res[i];var ch=cur[i];if(!keyState[ch]||rank[res[i]]>rank[keyState[ch]]){keyState[ch]=res[i];keys[ch].className="k "+res[i]}}
guesses.push(cur);save();
if(cur===ANSWER){done=true;say(WIN_NOTE);setProgress("wordle",{complete:true,line:"Solved in "+guesses.length+"/6"});return}
if(guesses.length===MAX){done=true;say("The word was GLOVE.");return}
cur="";say("");render()}
var SAVE="ourgames-wordle";
function setProgress(id,value){try{var p=JSON.parse(localStorage.getItem("anniversary-progress")||"{}");if(value===null)delete p[id];else p[id]=value;localStorage.setItem("anniversary-progress",JSON.stringify(p));if(window.refreshProgress)window.refreshProgress()}catch(e){}}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(guesses))}catch(e){}}
document.getElementById("wclear").addEventListener("click",function(){
guesses=[];cur="";done=false;keyState={};setProgress("wordle",null);
rows.forEach(function(rw){rw.tiles.forEach(function(t){t.textContent="";t.className="tile"})});
Object.keys(keys).forEach(function(k){keys[k].className="k"});
save();say("Guess the five-letter word in six tries.")});
try{JSON.parse(localStorage.getItem(SAVE)||"[]").forEach(function(g){if(!done)acceptGuess(g)});cur="";render()}catch(e){}
})();
</script>
</body></html>
